name: CI - Loan Approval Model Training

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
  DAGSHUB_OWNER: nuris-isw
  DAGSHUB_REPO: Eksperimen_SML_Nuris

jobs:
  train-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: loan-approval-env
          environment-file: MLProject/conda.yaml
          auto-activate: false

      # -------------------------------------------------------
      # Jalankan pelatihan via MLflow Project
      # -------------------------------------------------------
      - name: Run MLflow Project Training
        shell: bash -el {0}
        run: |
          mlflow run MLProject/ \
            --env-manager local \
            -P data_path=../loan_approval_preprocessing.csv \
            -P n_estimators=200 \
            -P max_depth=10 \
            -P random_state=42

      # -------------------------------------------------------
      # Simpan model ke GitHub Artifacts
      # -------------------------------------------------------
      - name: Upload model artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: loan-approval-model
          path: run_id.txt
          retention-days: 30

      # -------------------------------------------------------
      # Build & Push Docker Image ke Docker Hub (Advanced)
      # -------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image via mlflow build-docker
        shell: bash -el {0}
        run: |
          RUN_ID=$(cat run_id.txt)
          echo "Run ID: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          mlflow models build-docker \
            -m "runs:/$RUN_ID/model" \
            -n "${{ secrets.DOCKERHUB_USERNAME }}/loan-approval-model:latest" \
            --enable-mlserver

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/loan-approval-model:latest
          echo "Docker image berhasil di-push ke Docker Hub"

      - name: Update docker_hub_link.txt
        run: |
          echo "https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/loan-approval-model" > docker_hub_link.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker_hub_link.txt
          git diff --staged --quiet || git commit -m "CI: update Docker Hub link [skip ci]"
          git push
